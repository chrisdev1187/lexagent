<style>
:root {
  --midnight-court: #050505;
  --midnight-deep:  #0a0a0c;
  --midnight-raised:#111114;
  --midnight-elev:  #17171c;
  --midnight-line:  #1f1f26;
  --midnight-mute:  #2a2a33;
  --bg-base:   #050505;
  --bg-panel:  #0a0a0c;
  --bg-raised: #111114;
  --gavel-chrome:   #e0e0e0;
  --gavel-silver:   #b8b8bc;
  --gavel-steel:    #7a7a82;
  --gavel-graphite: #4a4a52;
  --fg-primary:   #e0e0e0;
  --fg-secondary: #b8b8bc;
  --fg-tertiary:  #7a7a82;
  --fg-quaternary:#4a4a52;
  --verdict-neon:   #00ffc3;
  --verdict-violet: #6a00ff;
  --verdict-amber:  #ffb800;
  --verdict-crimson:#ff3355;
  --border-hair: rgba(224,224,224,0.08);
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans:  'Inter', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', ui-monospace, monospace;
  --ease-terminal: cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg-base); color: var(--fg-primary); overflow: hidden; }
#root { height: 100vh; display: flex; flex-direction: column; }

body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(to right, rgba(0,255,195,var(--blueprint-opacity,0.022)) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,255,195,var(--blueprint-opacity,0.022)) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 75% 8%, black 0%, transparent 65%);
}

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(224,224,224,0.07); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(224,224,224,0.14); }
::selection { background: var(--verdict-neon); color: var(--midnight-court); }
:focus-visible { outline: 1.5px solid var(--verdict-neon); outline-offset: 2px; border-radius: 2px; }
input, textarea, button { font-family: inherit; }
input::placeholder, textarea::placeholder { color: var(--fg-quaternary); }

/* ── Scanline Logo Animation ── */
@keyframes scan-sweep {
  0%, 8%  { clip-path: inset(100% 0 0% 0); }
  38%     { clip-path: inset(0%   0 0% 0); }
  72%     { clip-path: inset(0%   0 0% 0); }
  96%,100%{ clip-path: inset(0%   0 100% 0); }
}
@keyframes scanline-base {
  0%, 8%  { opacity: 0.18; }
  18%     { opacity: 1; }
  88%     { opacity: 1; }
  100%    { opacity: 0.18; }
}
@keyframes scan-bar {
  0%,4%   { top: 100%; opacity: 0; }
  8%      { top: 100%; opacity: 1; }
  38%     { top: 0%;   opacity: 1; }
  46%     { top: -4%;  opacity: 0; }
  56%     { top: 100%; opacity: 0; }
  64%     { top: 100%; opacity: 1; }
  96%     { top: 0%;   opacity: 1; }
  100%    { top: -4%;  opacity: 0; }
}



/* ── Tab active underline ── */
.tab-active-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 1.5px; background: var(--verdict-neon);
  border-radius: 1px 1px 0 0;
  box-shadow: 0 0 6px rgba(0,255,195,0.6);
}

/* ── Fade in ── */
@keyframes fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fade-in 0.3s var(--ease-terminal) both; }

/* ── Stat card ── */
.lex-stat-card {
  position: relative; overflow: hidden;
  background: rgba(17,17,20,0.8);
  border: 0.5px solid rgba(224,224,224,0.09);
  border-radius: 8px; padding: 14px 16px;
  cursor: pointer; transition: border-color 160ms, transform 160ms;
}
.lex-stat-card:hover { border-color: rgba(224,224,224,0.2); transform: translateY(-1px); }
.lex-stat-card__accent { position: absolute; top: 0; left: 0; right: 0; height: 1.5px; }
.lex-stat-card__body { display: flex; align-items: center; gap: 12; margin-top: 10px; }
.lex-stat-card__icon { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.lex-stat-card__meta { flex: 1; min-width: 0; }
.lex-stat-card__label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-quaternary); }
.lex-stat-card__number { font-family: var(--font-serif); font-size: 24px; font-weight: 500; color: var(--fg-primary); letter-spacing: -0.02em; line-height: 1.1; }

/* ── Chip ── */
.lex-chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
.lex-chip--neon    { background: rgba(0,255,195,0.08);   border: 0.5px solid rgba(0,255,195,0.28);   color: var(--verdict-neon);   }
.lex-chip--amber   { background: rgba(255,184,0,0.08);   border: 0.5px solid rgba(255,184,0,0.28);   color: var(--verdict-amber);  }
.lex-chip--violet  { background: rgba(106,0,255,0.08);   border: 0.5px solid rgba(106,0,255,0.28);   color: var(--verdict-violet); }
.lex-chip--neutral { background: rgba(224,224,224,0.04); border: 0.5px solid rgba(224,224,224,0.12); color: var(--fg-tertiary);    }
</style>
</head>

const Sidebar = ({ activeMatterId, onSelectMatter, view, onView, onNewMatter, overrideWidth, scanlineSpeed }) => {
  const [collapsed, setCollapsed] = React.useState(() => localStorage.getItem('lex.collapsed') === '1');
  const [userMenuOpen, setUserMenuOpen] = React.useState(false);
  const menuRef = React.useRef(null);

  const W = collapsed ? 52 : (overrideWidth || 256);

  const toggle = () => {
    const next = !collapsed;
    setCollapsed(next);
    localStorage.setItem('lex.collapsed', next ? '1' : '0');
  };

  React.useEffect(() => {
    if (!userMenuOpen) return;
    const fn = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setUserMenuOpen(false); };
    document.addEventListener('mousedown', fn);
    return () => document.removeEventListener('mousedown', fn);
  }, [userMenuOpen]);

  const navItems = [
    { id:'dashboard', icon:'dashboard', label:'Dashboard'     },
    { id:'clients',   icon:'users',     label:'Clients'       },
    { id:'settings',  icon:'settings',  label:'Settings'      },

    collapsed
      ? <div title={label} style={{ width:'100%' }}>{children}</div>
      : children
  );

  return (
    <aside style={{
      width:W, minWidth:W,
      background:'var(--bg-panel)',
      borderRight:'0.5px solid var(--border-hair)',
      display:'flex', flexDirection:'column', height:'100%',
      transition:'width 0.22s var(--ease-terminal), min-width 0.22s var(--ease-terminal)',

        borderBottom:'0.5px solid var(--border-hair)',

                  borderRadius:4, border:`none`, borderLeft:`2px solid ${active?'var(--verdict-neon)':'transparent'}`,

              <Tip key={m.id} label={`${m.title} — ${m.status}`}>

            </div>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.14em',
              color:'var(--verdict-neon)', background:'rgba(0,255,195,0.06)',
              border:'0.5px solid rgba(0,255,195,0.22)', padding:'2px 6px', borderRadius:2 }}>FREE</span>
          </div>
        )}

        {/* User */}
        <div ref={menuRef} style={{ position:'relative' }}>
          <button onClick={() => setUserMenuOpen(v=>!v)} style={{
            width:'100%', display:'flex', alignItems:'center', justifyContent:collapsed?'center':'flex-start',
            gap:8, padding: collapsed?'10px 0':'10px 12px',
            background: userMenuOpen?'rgba(0,255,195,0.04)':'transparent',
            border:'none', cursor:'pointer', borderTop:'0.5px solid rgba(224,224,224,0.06)',
          }}>
            <div style={{ width:26, height:26, borderRadius:999, flexShrink:0,
              display:'flex', alignItems:'center', justifyContent:'center',
              background:'linear-gradient(135deg,rgba(0,255,195,0.15),rgba(106,0,255,0.15))',
              border:'0.5px solid rgba(0,255,195,0.22)' }}>
              <Icon name="user" size={12} color="var(--verdict-neon)" />
            </div>
            {!collapsed && (
              <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--fg-tertiary)',
                overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1, textAlign:'left' }}>
                attorney
              </span>
            )}
          </button>
          {userMenuOpen && (
            <div style={{
              position:'absolute', bottom:'100%', left:collapsed?'calc(100% + 6px)':8, right:collapsed?'auto':8,
              top: collapsed ? 0 : 'auto',
              background:'var(--midnight-deep)', border:'0.5px solid rgba(0,255,195,0.22)',
              borderRadius:6, boxShadow:'0 8px 32px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(0,255,195,0.06)',
              overflow:'hidden', zIndex:20, minWidth:180,
            }}>
              {[
                { icon:'user',       label:'Profile & Usage' },
                { icon:'settings',   label:'Billing & Plan'  },
              ].map(({ icon, label }) => (
                <div key={label} onClick={() => setUserMenuOpen(false)} style={{
                  display:'flex', alignItems:'center', gap:8, padding:'9px 12px',
                  cursor:'pointer', color:'var(--fg-secondary)', fontSize:12,
                  fontFamily:'var(--font-sans)',
                }}
                onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,0.03)'}
                onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                  <Icon name={icon} size={12} color="var(--verdict-neon)" /> {label}
                </div>
              ))}
              <div style={{ height:'0.5px', background:'rgba(224,224,224,0.07)' }}/>
              <div onClick={() => setUserMenuOpen(false)} style={{
                display:'flex', alignItems:'center', gap:8, padding:'9px 12px',
                cursor:'pointer', color:'var(--verdict-crimson)', fontSize:12, fontFamily:'var(--font-sans)',
              }}
              onMouseEnter={e => e.currentTarget.style.background='rgba(255,51,85,0.04)'}
              onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                <Icon name="logout" size={12} color="var(--verdict-crimson)" /> Sign out
              </div>
            </div>
          )}
        </div>

        {/* Collapse */}
        <button onClick={toggle} style={{
          width:'100%', display:'flex', alignItems:'center', justifyContent:'center',
          padding:'7px 0', background:'none', border:'none',
          borderTop:'0.5px solid rgba(224,224,224,0.06)',
          color:'var(--fg-quaternary)', cursor:'pointer', transition:'color 160ms',
        }}
        onMouseEnter={e => e.currentTarget.style.color='var(--fg-primary)'}
        onMouseLeave={e => e.currentTarget.style.color='var(--fg-quaternary)'}>
          <Icon name={collapsed?'chevronRight':'chevronLeft'} size={12} color="currentColor"
            style={{ transition:'transform 0.2s var(--ease-terminal)' }}/>
        </button>
      </div>
    </aside>
  );
};

          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {deadlines.map(d => {
              const color = PRIORITY_COLOR[d.priority] ?? 'var(--fg-quaternary)';
              const days  = daysUntil(d.dueDate);
              return (
                <div key={d.id} style={{ display:'flex', alignItems:'center', gap:0, borderRadius:6, overflow:'hidden', background:'rgba(255,255,255,0.02)', border:'0.5px solid rgba(224,224,224,0.07)' }}>
                  <div style={{ width:3, alignSelf:'stretch', background:color, flexShrink:0, boxShadow:`0 0 6px ${color}` }}/>
                  <div style={{ display:'flex', alignItems:'center', gap:10, flex:1, padding:'9px 12px' }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <p style={{ fontSize:12, color:'var(--fg-primary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{d.title}</p>
                      <p style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--fg-quaternary)', marginTop:2 }}>{d.dueDate}</p>
                    </div>
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.1em', textTransform:'uppercase', padding:'2px 8px', borderRadius:999, flexShrink:0,
                      background:`color-mix(in srgb,${color} 12%,transparent)`, color, border:`0.5px solid color-mix(in srgb,${color} 30%,transparent)` }}>
                      {days <= 0 ? 'TODAY' : `${days}d`}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* LexMemory — HIDDEN ON DESKTOP */}
      <style>{`@media(min-width:768px){.lex-memory-panel{display:none!important;}}`}</style>
      <div className="lex-memory-panel" style={{ padding:'14px 18px', borderRadius:8, marginBottom:16,
        background:'rgba(0,255,195,0.03)', border:'0.5px solid rgba(0,255,195,0.22)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:7 }}>
          <Icon name="brain" size={12} color="var(--verdict-neon)"/>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em', textTransform:'uppercase', color:'var(--verdict-neon)' }}>LexMemory</span>
        </div>
      </div>
    </div>
  );
};

/* ════════════════════════════════════
   MATTER DETAIL
════════════════════════════════════ */
const MatterDetail = ({ matterId, onBack, tweaks = {} }) => {
  const [activeTab, setActiveTab] = React.useState(() => localStorage.getItem('lex.tab') || 'overview');
  const matter = LEX_MATTERS.find(m => m.id === matterId) || LEX_MATTERS[0];
  const tabH = tweaks.tabbarDensity === 'compact' ? 34 : tweaks.tabbarDensity === 'spacious' ? 52 : 42;

  React.useEffect(() => { localStorage.setItem('lex.tab', activeTab); }, [activeTab]);

  const renderPanel = () => {
    if (activeTab === 'overview') return <OverviewPage matter={matter} cardStyle={tweaks.cardStyle} />;
    return (
      <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:12, padding:40 }}>
        <div style={{ width:44, height:44, borderRadius:6, background:'rgba(0,255,195,0.05)',
          border:'0.5px solid rgba(0,255,195,0.18)', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <Icon name={MATTER_TABS.find(t=>t.id===activeTab)?.icon||'file'} size={18} color="var(--verdict-neon)" />
        </div>
        <p style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.16em', textTransform:'uppercase', color:'var(--fg-quaternary)' }}>
          {MATTER_TABS.find(t=>t.id===activeTab)?.label} — No data
        </p>
        <LexBtn variant="secondary" small>Add entry</LexBtn>
      </div>
    );
  };

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0, overflow:'hidden' }}>
      <MatterHeader matter={matter} onBack={onBack} />
      <MatterTabBar activeTab={activeTab} onTab={setActiveTab} minHeight={tabH} />
      <div style={{ flex:1, overflow:'auto', display:'flex', flexDirection:'column' }}>
        {renderPanel()}
      </div>
    </div>
  );
};

/* ════════════════════════════════════
   DASHBOARD
════════════════════════════════════ */
const Dashboard = ({ onSelectMatter }) => {
  const [search, setSearch] = React.useState('');
  const [filter, setFilter] = React.useState('All');
  const filters = ['All','Active','Pending','Urgent','Closed'];
  const filtered = LEX_MATTERS.filter(m => {
    const matchSearch = !search || m.title.toLowerCase().includes(search.toLowerCase()) || m.client.toLowerCase().includes(search.toLowerCase());
    return matchSearch && (filter==='All' || m.status===filter);
  });

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'24px 24px 40px' }}>
      <div style={{ maxWidth:1200, margin:'0 auto' }}>
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20 }}>
          <div>
            <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:3 }}>
              <span style={{ color:'var(--verdict-neon)', fontSize:11 }}>▸</span>
              <h1 style={{ fontFamily:'var(--font-serif)', fontSize:20, fontWeight:500, color:'var(--fg-primary)', letterSpacing:'-0.01em' }}>Dashboard</h1>
            </div>
            <p style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--fg-quaternary)' }}>
              {LEX_MATTERS.length} matters · All active files
            </p>
          </div>
          <LexBtn variant="primary" icon={<Icon name="plus" size={13} color="currentColor"/>}>New Matter</LexBtn>
        </div>

        {/* Stats */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:10, marginBottom:20 }}>
          {[
            { icon:'folder', label:'Total Matters',     value:LEX_MATTERS.length, color:'var(--fg-secondary)' },
            { icon:'shield', label:'Citations Verified', value:LEX_MATTERS.reduce((a,m)=>a+m.verified,0), color:'var(--verdict-neon)' },
            { icon:'clock',  label:'Billable Hours',     value:`${LEX_MATTERS.reduce((a,m)=>a+m.hours,0).toFixed(1)}h`, color:'var(--verdict-amber)' },
            { icon:'calendar',label:'Active Deadlines',  value:LEX_MATTERS.reduce((a,m)=>a+m.deadlines,0), color:'var(--verdict-crimson)' },
          ].map(s => (
            <div key={s.label} style={{ background:'rgba(17,17,20,0.8)', border:'0.5px solid rgba(224,224,224,0.09)', borderRadius:6, padding:'12px 14px', display:'flex', alignItems:'center', gap:12 }}>
              <div style={{ width:30, height:30, borderRadius:5, background:`color-mix(in srgb,${s.color} 12%,transparent)`, border:`0.5px solid color-mix(in srgb,${s.color} 28%,transparent)`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                <Icon name={s.icon} size={14} style={{ color:s.color }} />
              </div>
              <div>
                <div style={{ fontFamily:'var(--font-serif)', fontSize:22, fontWeight:500, color:'var(--fg-primary)', lineHeight:1, marginBottom:3 }}>{s.value}</div>
                <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--fg-quaternary)' }}>{s.label}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Search + filters */}
        <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
          <div style={{ position:'relative', flex:1, minWidth:180 }}>
            <Icon name="search" size={12} color="var(--fg-quaternary)" style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)' }} />
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search matters…" style={{
              width:'100%', boxSizing:'border-box', paddingLeft:32, paddingRight:12, paddingTop:8, paddingBottom:8,
              background:'rgba(255,255,255,0.025)', border:'0.5px solid rgba(224,224,224,0.10)',
              borderRadius:4, color:'var(--fg-primary)', outline:'none',
              fontFamily:'var(--font-sans)', fontSize:13,
            }} />
          </div>
          <div style={{ display:'flex', gap:5 }}>
            {filters.map(f => (
              <button key={f} onClick={()=>setFilter(f)} style={{
                padding:'7px 11px', borderRadius:4, cursor:'pointer',
                background: filter===f?'rgba(0,255,195,0.07)':'rgba(255,255,255,0.02)',
                border:`0.5px solid ${filter===f?'rgba(0,255,195,0.28)':'rgba(224,224,224,0.08)'}`,
                color: filter===f?'var(--verdict-neon)':'var(--fg-tertiary)',
                fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
              }}>{f}</button>
            ))}
          </div>
        </div>

        {/* Grid */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>
          {filtered.map((m, i) => {
            const dot = STATUS_DOT[m.status];
            const kind = STATUS_KIND[m.status] || 'neutral';
            return (
              <div key={m.id} className="fade-in" onClick={() => onSelectMatter(m.id)}
                style={{ animationDelay:`${i*0.04}s`, background:'rgba(17,17,20,0.8)',
                  border:'0.5px solid rgba(224,224,224,0.09)', borderRadius:6, padding:14, cursor:'pointer',
                  transition:'border-color 160ms, transform 160ms',
                }}
                onMouseEnter={e => { e.currentTarget.style.borderColor='rgba(0,255,195,0.22)'; e.currentTarget.style.transform='translateY(-1px)'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor='rgba(224,224,224,0.09)'; e.currentTarget.style.transform='translateY(0)'; }}>
                <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8, marginBottom:10 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <h3 style={{ fontFamily:'var(--font-serif)', fontSize:13, fontStyle:'italic', color:'var(--fg-primary)', margin:'0 0 2px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', letterSpacing:'-0.01em' }}>{m.title}</h3>
                    <p style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--fg-quaternary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.client}</p>
                  </div>
                  <StatusChip kind={kind} dot>{m.status}</StatusChip>
                </div>
                <div style={{ display:'flex', gap:5, marginBottom:10, flexWrap:'wrap' }}>
                  {m.caseType && <span className="lex-chip lex-chip--neutral">{m.caseType}</span>}
                  {m.jurisdiction && <span className="lex-chip lex-chip--neutral">{m.jurisdiction}</span>}
                </div>
                <div style={{ display:'flex', gap:12, paddingTop:9, borderTop:'0.5px solid rgba(224,224,224,0.07)' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                    <Icon name="shield" size={10} color="var(--verdict-neon)" />
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--fg-tertiary)' }}>{m.verified}</span>
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                    <Icon name="clock" size={10} color="var(--fg-quaternary)" />
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--fg-tertiary)' }}>{m.hours}h</span>
                  </div>
                  {m.deadlines > 0 && (
                    <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                      <Icon name="calendar" size={10} color="var(--verdict-amber)" />
                      <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--fg-tertiary)' }}>{m.deadlines}</span>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

/* ════════════════════════════════════
   APP SHELL
════════════════════════════════════ */
function App() {
  const [view, setView] = React.useState(() => localStorage.getItem('lex.view') || 'dashboard');
  const [activeMatter, setActiveMatter] = React.useState(() => localStorage.getItem('lex.matter') || LEX_MATTERS[0].id);
  const [paletteOpen, setPaletteOpen] = React.useState(false);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply accent color CSS var live
  React.useEffect(() => {
    document.documentElement.style.setProperty('--verdict-neon', tweaks.accentColor);
  }, [tweaks.accentColor]);

  // Apply blueprint grid
  React.useEffect(() => {
    document.documentElement.style.setProperty(
      '--blueprint-opacity', tweaks.blueprintGrid ? '0.022' : '0'
    );
  }, [tweaks.blueprintGrid]);

  React.useEffect(() => { localStorage.setItem('lex.view', view); }, [view]);
  React.useEffect(() => { if(activeMatter) localStorage.setItem('lex.matter', activeMatter); }, [activeMatter]);

  React.useEffect(() => {
    const fn = e => {
      if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); setPaletteOpen(p=>!p); }
      if (e.key==='Escape') setPaletteOpen(false);
    };
    window.addEventListener('keydown', fn);
    return () => window.removeEventListener('keydown', fn);
  }, []);

  const handleSelectMatter = id => { setActiveMatter(id); setView('matter'); };

  return (
    <div data-screen-label="Lex Console" style={{ height:'100vh', display:'flex', flexDirection:'column', position:'relative', zIndex:1 }}>
      <TopBar onOpenPalette={() => setPaletteOpen(true)} />
      <div style={{ display:'flex', flex:1, minHeight:0, overflow:'hidden' }}>
        <Sidebar
          activeMatterId={activeMatter}
          onSelectMatter={handleSelectMatter}
          view={view}
          onView={setView}
          onNewMatter={() => {}}
          overrideWidth={tweaks.sidebarWidth}
          scanlineSpeed={tweaks.scanlineSpeed}
        />
        <main style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', overflow:'hidden', position:'relative' }}>
          {view==='dashboard' && <Dashboard onSelectMatter={handleSelectMatter} />}
          {view==='matter' && <MatterDetail matterId={activeMatter} onBack={() => setView('dashboard')} tweaks={tweaks} />}
          {view==='clients' && (
            <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:10 }}>
              <Icon name="users" size={28} color="var(--fg-quaternary)" />
              <p style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.16em', textTransform:'uppercase', color:'var(--fg-quaternary)' }}>Clients — v1.0</p>
            </div>
          )}
          {view==='settings' && (
            <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:10 }}>
              <Icon name="settings" size={28} color="var(--fg-quaternary)" />
              <p style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.16em', textTransform:'uppercase', color:'var(--fg-quaternary)' }}>Settings</p>
            </div>
          )}
        </main>
      </div>

      {/* Command Palette */}
      {/* Tweaks Panel */}
      <TweaksPanel title="Tweaks">
        <TweakColor    label="Accent color"     value={tweaks.accentColor}    onChange={v => setTweak('accentColor', v)} />
        <TweakSlider   label="Sidebar width"    value={tweaks.sidebarWidth}   onChange={v => setTweak('sidebarWidth', v)}   min={200} max={320} step={4} />
        <TweakSlider   label="Scanline speed"   value={tweaks.scanlineSpeed}  onChange={v => setTweak('scanlineSpeed', v)}  min={1.5} max={9}   step={0.5} />
        <TweakToggle   label="Blueprint grid"   value={tweaks.blueprintGrid}  onChange={v => setTweak('blueprintGrid', v)} />
        <TweakRadio    label="Tab density"      value={tweaks.tabbarDensity}  onChange={v => setTweak('tabbarDensity', v)}
          options={['compact','normal','spacious']} />
        <TweakRadio    label="Card style"       value={tweaks.cardStyle}      onChange={v => setTweak('cardStyle', v)}
          options={['flat','raised','glass']} />
      </TweaksPanel>

      {paletteOpen && (
        <div style={{ position:'fixed', inset:0, zIndex:200, display:'flex', alignItems:'flex-start', justifyContent:'center', paddingTop:100 }}>
          <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.65)', backdropFilter:'blur(6px)' }} onClick={() => setPaletteOpen(false)} />
          <div style={{ position:'relative', width:540, background:'rgba(14,14,18,0.95)',
            backdropFilter:'blur(32px) saturate(180%)',
            border:'0.5px solid rgba(0,255,195,0.22)', borderRadius:10,
            boxShadow:'0 32px 64px rgba(0,0,0,0.7), 0 0 0 0.5px rgba(0,255,195,0.08)',
            overflow:'hidden' }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, padding:'12px 16px', borderBottom:'0.5px solid rgba(224,224,224,0.08)' }}>
              <Icon name="search" size={14} color="var(--verdict-neon)" />
              <input autoFocus placeholder="Search matters, commands, citations…"
                onKeyDown={e => e.key==='Escape' && setPaletteOpen(false)}
                style={{ flex:1, background:'none', border:'none', outline:'none',
                  fontFamily:'var(--font-sans)', fontSize:14, color:'var(--fg-primary)' }} />
              <kbd style={{ fontFamily:'var(--font-mono)', fontSize:9, padding:'2px 6px', borderRadius:3,
                border:'0.5px solid rgba(224,224,224,0.12)', background:'rgba(255,255,255,0.03)', color:'var(--fg-tertiary)' }}>ESC</kbd>
            </div>
            <div style={{ maxHeight:340, overflowY:'auto' }}>
              {LEX_MATTERS.map(m => (
                <div key={m.id} onClick={() => { handleSelectMatter(m.id); setPaletteOpen(false); }}
                  style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 16px', cursor:'pointer',
                    borderBottom:'0.5px solid rgba(224,224,224,0.05)', transition:'background 160ms' }}
                  onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,0.025)'}
                  onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                  <div style={{ width:28, height:28, borderRadius:4, background:'rgba(0,255,195,0.06)',
                    border:'0.5px solid rgba(0,255,195,0.14)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                    <Icon name="folder" size={13} color="var(--verdict-neon)" />
                  </div>
                  <span style={{ fontFamily:'var(--font-serif)', fontSize:13, fontStyle:'italic', color:'var(--fg-primary)', flex:1 }}>{m.title}</span>
                  <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--fg-quaternary)' }}>{m.id}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
