<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexAgent — Neon Orbit (Dark)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --midnight-court: #050505;
    --verdict-neon: #00ffc3;
    --gavel-silver: #b8b8bc;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 200px;
    height: 200px;
    background: var(--midnight-court);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap {
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  svg {
    width: 120px;
    height: 120px;
    overflow: visible;
  }
  .orbit-body {
    color: var(--gavel-silver);
    animation: neon-breathe 2s ease-in-out infinite;
  }
  .orbit-ring {
    transform-origin: 20px 20px;
    animation: spin-orbit 4s linear infinite;
    stroke: var(--verdict-neon);
    stroke-dasharray: 14 96;
    filter: drop-shadow(0 0 4px var(--verdict-neon));
  }
  @keyframes spin-orbit {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -110; }
  }
  @keyframes neon-breathe {
    0%, 100% { filter: drop-shadow(0 0 2px var(--verdict-neon)); color: var(--gavel-silver); }
    50% { filter: drop-shadow(0 0 10px var(--verdict-neon)); color: var(--verdict-neon); }
  }
</style>
</head>
<body>
<div class="wrap">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" stroke="currentColor">
    <g class="orbit-body">
      <line x1="20" y1="10" x2="20" y2="30" stroke-width="1.25"/>
      <line x1="14" y1="30" x2="26" y2="30" stroke-width="1.25"/>
      <line x1="11" y1="15" x2="29" y2="15" stroke-width="1.25"/>
      <line x1="11" y1="15" x2="11" y2="20" stroke-width="0.75"/>
      <line x1="11" y1="20" x2="8" y2="23" stroke-width="0.75"/>
      <line x1="11" y1="20" x2="14" y2="23" stroke-width="0.75"/>
      <path d="M7 23 Q11 26 15 23" stroke-width="1" fill="none"/>
      <line x1="29" y1="15" x2="29" y2="20" stroke-width="0.75"/>
      <line x1="29" y1="20" x2="26" y2="23" stroke-width="0.75"/>
      <line x1="29" y1="20" x2="32" y2="23" stroke-width="0.75"/>
      <path d="M25 23 Q29 26 33 23" stroke-width="1" fill="none"/>
      <circle cx="20" cy="10" r="1.25" fill="currentColor"/>
    </g>
    <circle class="orbit-ring" cx="20" cy="20" r="17.5" stroke-width="0.75" fill="none"/>
  </svg>
</div>
</body>
</html>
