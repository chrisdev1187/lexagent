services:
  - type: web
    name: lexagent-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # ── LLM: set GROQ_API_KEY for free tier (recommended) ─────────────────
      - key: GROQ_API_KEY
        sync: false
      # ── OR use Anthropic (paid) ─────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Supabase (optional) ────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # ── Legal APIs (optional) ──────────────────────────────────────────
      - key: COURTLISTENER_TOKEN
        sync: false
      - key: GOVINFO_KEY
        sync: false
      # ── CORS: add your Vercel frontend URL ────────────────────────────
      - key: ALLOWED_ORIGINS
        sync: false
