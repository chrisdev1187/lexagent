<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lex Protocol Console — UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-base); color: var(--fg-primary); overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }

  /* Blueprint grid - bleeds from top-right */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(to right, rgba(0,255,195,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,255,195,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 80% 10%, black 0%, transparent 70%);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(224,224,224,0.08); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(224,224,224,0.14); }

  /* Selection */
  ::selection { background: var(--verdict-neon); color: var(--midnight-court); }

  /* Focus */
  :focus-visible { outline: 2px solid var(--verdict-neon); outline-offset: 2px; border-radius: 2px; }

  input, textarea, button { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: var(--fg-quaternary); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Atoms.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="MatterDetail.jsx"></script>

<script type="text/babel">
// ── TopBar ──────────────────────────────────────────────────────────────────
const TopBar = ({ onOpenPalette, firmName }) => (
  <header style={{
    height: 52, display: 'flex', alignItems: 'center', padding: '0 16px', gap: 12,
    background: 'rgba(10,10,12,0.85)',
    backdropFilter: 'blur(18px) saturate(160%)',
    WebkitBackdropFilter: 'blur(18px) saturate(160%)',
    borderBottom: '0.5px solid rgba(224,224,224,0.08)',
    position: 'relative', zIndex: 30, flexShrink: 0,
  }}>
    {/* Brand */}
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <div style={{ width: 22, height: 22, borderRadius: 3, background: 'rgba(0,255,195,0.08)', border: '0.5px solid rgba(0,255,195,0.25)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <LexIcon name="scale" size={12} color="var(--verdict-neon)" />
      </div>
      <span style={{ fontFamily: 'var(--font-serif)', fontSize: 14, fontWeight: 500, color: 'var(--fg-primary)', letterSpacing: '-0.01em' }}>
        {firmName || 'LEX PROTOCOL'}
      </span>
      <span style={{ fontFamily: 'var(--font-mono)', fontSize: 9, color: 'var(--fg-quaternary)', padding: '1px 5px', border: '0.5px solid rgba(224,224,224,0.08)', borderRadius: 2, letterSpacing: '0.14em' }}>ARES</span>
    </div>

    {/* Spacer */}
    <div style={{ flex: 1 }} />

    {/* Search trigger */}
    <button onClick={onOpenPalette} style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: 'rgba(17,17,20,0.60)', border: '0.5px solid rgba(224,224,224,0.08)',
      borderRadius: 4, padding: '6px 10px', width: 260, cursor: 'pointer',
      fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--fg-tertiary)',
      transition: 'border-color 160ms',
    }}>
      <LexIcon name="search" size={13} color="var(--fg-quaternary)" />
      Search matters, citations…
      <span style={{ marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 10, padding: '1px 5px', borderRadius: 2, border: '0.5px solid rgba(224,224,224,0.08)', background: 'rgba(255,255,255,0.02)', color: 'var(--fg-tertiary)' }}>⌘K</span>
    </button>

    {/* Notification dot */}
    <button style={{ position: 'relative', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg-tertiary)', display: 'flex', padding: 4 }}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span style={{ position: 'absolute', top: 2, right: 2, width: 6, height: 6, borderRadius: 999, background: 'var(--verdict-crimson)', border: '1.5px solid var(--bg-base)' }} />
    </button>

    {/* Avatar */}
    <div style={{ width: 28, height: 28, borderRadius: 999, background: 'linear-gradient(135deg,rgba(0,255,195,0.15),rgba(106,0,255,0.15))', border: '0.5px solid rgba(0,255,195,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
      <LexIcon name="user" size={12} color="var(--verdict-neon)" />
    </div>
  </header>
);

// ── Command Palette ──────────────────────────────────────────────────────────
const CommandPalette = ({ onClose, onSelectMatter }) => {
  const [q, setQ] = React.useState('');
  const items = [
    { type: 'action', label: 'New matter', hint: '⌘N', icon: 'plus' },
    { type: 'action', label: 'Open Vault', hint: '', icon: 'file' },
    ...LEX_MATTERS.filter(m => !q || m.title.toLowerCase().includes(q.toLowerCase())).map(m => ({
      type: 'matter', label: m.title, hint: m.id, icon: 'briefcase', matter: m,
    })),
  ].filter(item => !q || item.label.toLowerCase().includes(q.toLowerCase()));

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', paddingTop: 120 }}>
      <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.65)', backdropFilter: 'blur(6px)' }} onClick={onClose} />
      <div style={{
        position: 'relative', width: 560, background: 'rgba(17,17,22,0.92)',
        backdropFilter: 'blur(32px) saturate(180%)',
        border: '0.5px solid rgba(0,255,195,0.22)', borderRadius: 10,
        boxShadow: '0 32px 64px rgba(0,0,0,0.7), 0 0 0 0.5px rgba(0,255,195,0.08)',
        overflow: 'hidden',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px', borderBottom: '0.5px solid rgba(224,224,224,0.08)' }}>
          <LexIcon name="search" size={15} color="var(--verdict-neon)" />
          <input autoFocus value={q} onChange={e => setQ(e.target.value)}
            placeholder="Search matters, commands, citations…"
            onKeyDown={e => e.key === 'Escape' && onClose()}
            style={{ flex: 1, background: 'none', border: 'none', outline: 'none', fontFamily: 'var(--font-sans)', fontSize: 15, color: 'var(--fg-primary)' }} />
          <kbd style={{ fontFamily: 'var(--font-mono)', fontSize: 10, padding: '2px 6px', borderRadius: 3, border: '0.5px solid rgba(224,224,224,0.12)', background: 'rgba(255,255,255,0.03)', color: 'var(--fg-tertiary)' }}>ESC</kbd>
        </div>
        <div style={{ maxHeight: 360, overflowY: 'auto' }}>
          {items.length === 0 && (
            <div style={{ padding: '24px', textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--fg-quaternary)' }}>No results</div>
          )}
          {items.map((item, i) => (
            <div key={i} onClick={() => { if (item.matter) { onSelectMatter(item.matter.id); } onClose(); }}
              style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 16px', cursor: 'pointer', borderBottom: '0.5px solid rgba(224,224,224,0.05)' }}>
              <div style={{ width: 28, height: 28, borderRadius: 4, background: 'rgba(0,255,195,0.06)', border: '0.5px solid rgba(0,255,195,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <LexIcon name={item.icon} size={13} color="var(--verdict-neon)" />
              </div>
              <span style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'var(--fg-primary)', flex: 1 }}>{item.label}</span>
              {item.hint && <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--fg-quaternary)' }}>{item.hint}</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── App Shell ────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = React.useState(() => localStorage.getItem('lex.view') || 'dashboard');
  const [activeMatter, setActiveMatter] = React.useState(() => localStorage.getItem('lex.matter') || LEX_MATTERS[0].id);
  const [paletteOpen, setPaletteOpen] = React.useState(false);

  React.useEffect(() => { localStorage.setItem('lex.view', view); }, [view]);
  React.useEffect(() => { if (activeMatter) localStorage.setItem('lex.matter', activeMatter); }, [activeMatter]);

  React.useEffect(() => {
    const onKey = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPaletteOpen(p => !p); }
      if (e.key === 'Escape') setPaletteOpen(false);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const handleSelectMatter = (id) => {
    setActiveMatter(id);
    setView('matter');
  };

  return (
    <div data-screen-label="Lex Protocol Console" style={{ height: '100vh', display: 'flex', flexDirection: 'column', position: 'relative', zIndex: 1 }}>
      <TopBar onOpenPalette={() => setPaletteOpen(true)} firmName="Harrison & Associates" />

      <div style={{ display: 'flex', flex: 1, minHeight: 0, overflow: 'hidden' }}>
        <LexSidebar
          activeMatter={activeMatter}
          onSelect={handleSelectMatter}
          view={view}
          onView={setView}
        />

        <main style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative', zIndex: 1 }}>
          {view === 'dashboard' && <Dashboard onSelectMatter={handleSelectMatter} />}
          {view === 'matter' && <MatterDetail matterId={activeMatter} onBack={() => setView('dashboard')} />}
          {view === 'clients' && (
            <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 12 }}>
              <LexIcon name="users" size={32} color="var(--fg-quaternary)" />
              <p style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--fg-quaternary)' }}>Clients — coming in v1.0</p>
            </div>
          )}
          {view === 'admin' && (
            <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 12 }}>
              <LexIcon name="settings" size={32} color="var(--fg-quaternary)" />
              <p style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--fg-quaternary)' }}>Administration</p>
            </div>
          )}
        </main>
      </div>

      {paletteOpen && <CommandPalette onClose={() => setPaletteOpen(false)} onSelectMatter={handleSelectMatter} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
