<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-base); font-family: var(--font-mono); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .item { background: var(--bg-raised); border: 0.5px solid var(--border-hair); border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .dot { width: 24px; height: 24px; border-radius: 999px; margin-bottom: 4px; }
  .tok { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-quaternary); }
  .val { font-size: 10px; color: var(--fg-tertiary); }
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="dot" style="background:rgba(0,255,195,0.08);border:0.5px solid rgba(0,255,195,0.35)"></div><div class="tok">Active</div><div class="val">neon 8%</div></div>
  <div class="item"><div class="dot" style="background:rgba(106,0,255,0.08);border:0.5px solid rgba(106,0,255,0.40)"></div><div class="tok">Sealed</div><div class="val">violet 8%</div></div>
  <div class="item"><div class="dot" style="background:rgba(255,184,0,0.08);border:0.5px solid rgba(255,184,0,0.40)"></div><div class="tok">Pending</div><div class="val">amber 8%</div></div>
  <div class="item"><div class="dot" style="background:rgba(255,51,85,0.08);border:0.5px solid rgba(255,51,85,0.40)"></div><div class="tok">Breach</div><div class="val">crimson 8%</div></div>
  <div class="item"><div class="dot" style="background:rgba(224,224,224,0.06);border:0.5px solid rgba(224,224,224,0.14)"></div><div class="tok">Closed</div><div class="val">chrome 6%</div></div>
  <div class="item"><div class="dot" style="background:rgba(20,20,26,0.55);backdrop-filter:blur(18px);border:0.5px solid rgba(224,224,224,0.10)"></div><div class="tok">Glass</div><div class="val">blur 18px</div></div>
  <div class="item"><div class="dot" style="background:rgba(0,255,195,0.06);border:0.5px dashed rgba(0,255,195,0.28)"></div><div class="tok">New action</div><div class="val">dashed neon</div></div>
  <div class="item"><div class="dot" style="background:linear-gradient(135deg,rgba(0,255,195,0.15),rgba(106,0,255,0.15));border:0.5px solid rgba(0,255,195,0.2)"></div><div class="tok">Avatar</div><div class="val">neon↗violet</div></div>
</div>
</body>
</html>
