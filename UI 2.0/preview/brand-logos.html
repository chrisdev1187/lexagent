<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-base); display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .group { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quaternary); }
  img, object { display: block; }
</style>
</head>
<body>
  <div class="group">
    <div class="label">Logo mark</div>
    <img src="../assets/logo-mark.svg" width="48" height="48" alt="Logo mark" />
  </div>
  <div class="group">
    <div class="label">Wordmark</div>
    <img src="../assets/logo-wordmark.svg" height="28" alt="LEX PROTOCOL wordmark" style="filter: brightness(0) invert(1) saturate(0)" />
  </div>
  <div class="group">
    <div class="label">Lockup</div>
    <img src="../assets/logo-lockup.svg" height="32" alt="Logo lockup" />
  </div>
  <div class="group">
    <div class="label">On dark · neon</div>
    <div style="display:flex;align-items:center;gap:10px;background:var(--bg-raised);padding:10px 14px;border-radius:6px;border:0.5px solid var(--border-hair)">
      <div style="width:28px;height:28px;border-radius:4px;background:rgba(0,255,195,0.06);border:0.5px solid rgba(0,255,195,0.25);display:flex;align-items:center;justify-content:center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00ffc3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="21"/><line x1="18" y1="3" x2="18" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M3 8h18M3 16h18"/></svg>
      </div>
      <div>
        <div style="font-family:var(--font-serif);font-size:13px;font-weight:500;color:var(--fg-primary);letter-spacing:-0.01em;line-height:1">LEX PROTOCOL</div>
        <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-quaternary);margin-top:2px">ARES v5</div>
      </div>
    </div>
  </div>
</body>
</html>
