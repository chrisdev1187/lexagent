<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-elev); font-family: var(--font-mono); display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .block { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 80px; height: 48px; background: var(--bg-raised); border-radius: 6px; }
  .label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-quaternary); }
</style>
</head>
<body>
  <div class="block">
    <div class="box" style="box-shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 1px 2px rgba(0,0,0,0.6)"></div>
    <div class="label">Shadow 1 · Flat</div>
  </div>
  <div class="block">
    <div class="box" style="box-shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 4px 12px rgba(0,0,0,0.55), 0 0 0 0.5px rgba(224,224,224,0.06)"></div>
    <div class="label">Shadow 2 · Card</div>
  </div>
  <div class="block">
    <div class="box" style="box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 16px 40px rgba(0,0,0,0.7), 0 0 0 0.5px rgba(224,224,224,0.08)"></div>
    <div class="label">Shadow 3 · Menu</div>
  </div>
  <div class="block">
    <div class="box" style="box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 40px 80px rgba(0,0,0,0.8), 0 0 0 0.5px rgba(0,255,195,0.10)"></div>
    <div class="label">Shadow 4 · Modal</div>
  </div>
  <div class="block">
    <div class="box" style="box-shadow:0 0 8px rgba(0,255,195,0.35)"></div>
    <div class="label">Glow · sm neon</div>
  </div>
  <div class="block">
    <div class="box" style="box-shadow:0 0 16px rgba(0,255,195,0.45), 0 0 32px rgba(0,255,195,0.20)"></div>
    <div class="label">Glow · md neon</div>
  </div>
  <div class="block">
    <div class="box" style="box-shadow:0 0 16px rgba(106,0,255,0.55), 0 0 32px rgba(106,0,255,0.22)"></div>
    <div class="label">Glow · violet</div>
  </div>
</body>
</html>
