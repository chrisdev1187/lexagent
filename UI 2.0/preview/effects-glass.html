<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; background: var(--bg-base); font-family: var(--font-mono); height: 150px; overflow: hidden; position: relative; }
  /* Blueprint grid bg */
  body::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to right, rgba(0,255,195,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,255,195,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 80% 20%, black 0%, transparent 80%);
  }
  .panels { display: flex; gap: 12px; padding: 16px; align-items: flex-start; position: relative; z-index: 1; }
  .glass {
    background: rgba(20,20,26,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 0.5px solid rgba(224,224,224,0.10);
    border-radius: 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    padding: 12px 16px;
  }
  .glass--strong {
    background: rgba(24,24,30,0.78);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
  }
  .label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quaternary); margin-bottom: 6px; }
  .val { font-size: 11px; color: var(--fg-secondary); }
  /* Scanline animation */
  @keyframes scanline { 0% { transform:translateY(-100%); } 100% { transform:translateY(200%); } }
  .scanline-demo { position: relative; overflow: hidden; width: 120px; height: 60px; border-radius: 4px; border: 0.5px solid rgba(0,255,195,0.20); background: rgba(17,17,20,0.8); }
  .scanline-demo::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(0,255,195,0.14) 50%, transparent 100%);
    animation: scanline 2.6s linear infinite;
  }
  .scan-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--verdict-neon); text-shadow: 0 0 8px rgba(0,255,195,0.35); padding: 8px 10px; }
</style>
</head>
<body>
  <div class="panels">
    <div>
      <div class="label">Glass · default</div>
      <div class="glass" style="width:130px">
        <div class="label" style="margin-bottom:2px">MATTER</div>
        <div class="val">In re: Nocturne</div>
      </div>
    </div>
    <div>
      <div class="label">Glass · strong</div>
      <div class="glass glass--strong" style="width:130px">
        <div class="label" style="margin-bottom:2px">SEALED</div>
        <div class="val" style="color:var(--verdict-violet)">§ Privileged</div>
      </div>
    </div>
    <div>
      <div class="label">Scanline</div>
      <div class="scanline-demo">
        <div class="scan-label">LIVE DATA</div>
      </div>
    </div>
    <div>
      <div class="label">Noise texture</div>
      <div style="width:80px;height:60px;border-radius:4px;border:0.5px solid rgba(224,224,224,0.08);background:var(--bg-raised);position:relative;overflow:hidden">
        <div style="position:absolute;inset:0;opacity:0.08;mix-blend-mode:overlay;background-image:url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'160\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\' numOctaves=\'2\' stitchTiles=\'stitch\'/></filter><rect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\'/></svg>')"></div>
      </div>
    </div>
  </div>
</body>
</html>
