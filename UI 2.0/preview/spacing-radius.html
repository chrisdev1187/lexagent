<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-raised); font-family: var(--font-mono); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 64px; height: 40px; background: var(--bg-elev); border: 0.5px solid var(--border-hair); }
  .label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-quaternary); }
</style>
</head>
<body>
  <div class="block"><div class="box" style="border-radius:2px"></div><div class="label">xs · 2px</div></div>
  <div class="block"><div class="box" style="border-radius:4px"></div><div class="label">sm · 4px</div></div>
  <div class="block"><div class="box" style="border-radius:6px"></div><div class="label">md · 6px</div></div>
  <div class="block"><div class="box" style="border-radius:10px"></div><div class="label">lg · 10px</div></div>
  <div class="block"><div class="box" style="border-radius:16px"></div><div class="label">xl · 16px</div></div>
  <div class="block"><div class="box" style="border-radius:999px"></div><div class="label">pill · ∞</div></div>
</body>
</html>
