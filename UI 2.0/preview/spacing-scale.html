<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-base); font-family: var(--font-mono); display: flex; gap: 24px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quaternary); }
  .bar { background: var(--verdict-neon); opacity: 0.6; border-radius: 1px; height: 6px; }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="width:4px"></div><div class="label">sp-1 · 4</div></div>
  <div class="col"><div class="bar" style="width:8px"></div><div class="label">sp-2 · 8</div></div>
  <div class="col"><div class="bar" style="width:12px"></div><div class="label">sp-3 · 12</div></div>
  <div class="col"><div class="bar" style="width:16px"></div><div class="label">sp-4 · 16</div></div>
  <div class="col"><div class="bar" style="width:20px"></div><div class="label">sp-5 · 20</div></div>
  <div class="col"><div class="bar" style="width:24px"></div><div class="label">sp-6 · 24</div></div>
  <div class="col"><div class="bar" style="width:32px"></div><div class="label">sp-8 · 32</div></div>
  <div class="col"><div class="bar" style="width:40px"></div><div class="label">sp-10 · 40</div></div>
  <div class="col"><div class="bar" style="width:48px"></div><div class="label">sp-12 · 48</div></div>
  <div class="col"><div class="bar" style="width:64px"></div><div class="label">sp-16 · 64</div></div>
</body>
</html>
