<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-base); font-family: var(--font-mono); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 96px; height: 48px; border-radius: 4px; border: 0.5px solid rgba(224,224,224,0.08); }
  .name { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quaternary); }
  .hex { font-size: 10px; color: var(--fg-tertiary); }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#e0e0e0"></div><div class="name">Chrome</div><div class="hex">#e0e0e0</div></div>
  <div class="swatch"><div class="chip" style="background:#b8b8bc"></div><div class="name">Silver</div><div class="hex">#b8b8bc</div></div>
  <div class="swatch"><div class="chip" style="background:#7a7a82"></div><div class="name">Steel</div><div class="hex">#7a7a82</div></div>
  <div class="swatch"><div class="chip" style="background:#4a4a52"></div><div class="name">Graphite</div><div class="hex">#4a4a52</div></div>
</div>
</body>
</html>
