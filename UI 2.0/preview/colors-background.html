<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-base); font-family: var(--font-mono); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 5px; }
  .chip { width: 96px; height: 48px; border-radius: 4px; border: 0.5px solid rgba(224,224,224,0.1); }
  .name { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quaternary); }
  .hex { font-size: 10px; color: var(--fg-tertiary); }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#050505;box-shadow:0 0 0 1px rgba(255,255,255,0.06)"></div><div class="name">Court</div><div class="hex">#050505</div></div>
  <div class="swatch"><div class="chip" style="background:#0a0a0c"></div><div class="name">Deep</div><div class="hex">#0a0a0c</div></div>
  <div class="swatch"><div class="chip" style="background:#111114"></div><div class="name">Raised</div><div class="hex">#111114</div></div>
  <div class="swatch"><div class="chip" style="background:#17171c"></div><div class="name">Elev</div><div class="hex">#17171c</div></div>
  <div class="swatch"><div class="chip" style="background:#1f1f26"></div><div class="name">Line</div><div class="hex">#1f1f26</div></div>
  <div class="swatch"><div class="chip" style="background:#2a2a33"></div><div class="name">Mute</div><div class="hex">#2a2a33</div></div>
</div>
</body>
</html>
