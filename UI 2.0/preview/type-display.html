<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-base); }
  .row { margin-bottom: 10px; border-bottom: 0.5px solid var(--border-hair); padding-bottom: 10px; display: flex; align-items: baseline; gap: 14px; }
  .row:last-child { border-bottom: none; margin-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quaternary); width: 80px; flex-shrink: 0; line-height: 1; }
</style>
</head>
<body>
  <div class="row">
    <div class="meta">Display</div>
    <div style="font-family:var(--font-serif);font-size:44px;font-weight:400;color:var(--fg-primary);line-height:1;letter-spacing:-0.02em">Lex Protocol</div>
  </div>
  <div class="row">
    <div class="meta">H1 · 72px</div>
    <div style="font-family:var(--font-serif);font-size:36px;font-weight:400;color:var(--fg-primary);line-height:1.05;letter-spacing:-0.02em">In re: Nocturne Data Breach</div>
  </div>
  <div class="row">
    <div class="meta">H3 · 36px</div>
    <div style="font-family:var(--font-serif);font-size:24px;font-weight:500;color:var(--fg-primary);line-height:1.2;letter-spacing:-0.01em;font-style:italic">Ashford v. Cipher Holdings</div>
  </div>
  <div class="row">
    <div class="meta">H4 · 28px</div>
    <div style="font-family:var(--font-sans);font-size:18px;font-weight:600;color:var(--fg-primary);letter-spacing:-0.01em">Case Management</div>
  </div>
</body>
</html>
