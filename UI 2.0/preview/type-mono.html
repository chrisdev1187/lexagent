<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-base); }
  .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; border-bottom: 0.5px solid var(--border-hair); padding-bottom: 10px; }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quaternary); width: 80px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="row"><div class="meta">Micro ID</div><span style="font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--verdict-neon);text-shadow:0 0 8px rgba(0,255,195,0.35)">CASE ID · 4492-X</span></div>
  <div class="row"><div class="meta">Timestamp</div><span style="font-family:var(--font-mono);font-size:12px;color:var(--fg-tertiary)">2026-04-18 · 14:32 PDT</span></div>
  <div class="row"><div class="meta">Citation</div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary)">Brown v. Board of Education, 347 U.S. 483 (1954)</span></div>
  <div class="row"><div class="meta">Verified</div><span style="font-family:var(--font-mono);font-size:11px;color:var(--verdict-neon);background:rgba(0,255,195,0.06);border:0.5px solid rgba(0,255,195,0.25);padding:2px 8px;border-radius:2px">[DB] VERIFIED</span></div>
  <div class="row"><div class="meta">Unconfirmed</div><span style="font-family:var(--font-mono);font-size:11px;color:var(--verdict-amber);background:rgba(255,184,0,0.06);border:0.5px solid rgba(255,184,0,0.3);padding:2px 8px;border-radius:2px">[WEB] UNCONFIRMED</span></div>
  <div class="row"><div class="meta">Not found</div><span style="font-family:var(--font-mono);font-size:11px;color:var(--verdict-crimson);background:rgba(255,51,85,0.06);border:0.5px solid rgba(255,51,85,0.25);padding:2px 8px;border-radius:2px">[MEM] NOT FOUND</span></div>
</body>
</html>
